<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dictionary App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .tabs {
            display: flex;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
        }

        .tab {
            flex: 1;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            background: #f8f9fa;
            border: none;
            font-size: 16px;
            font-weight: 600;
            color: #6c757d;
            transition: all 0.3s ease;
        }

        .tab:hover {
            background: #e9ecef;
        }

        .tab.active {
            background: white;
            color: #667eea;
            border-bottom: 3px solid #667eea;
        }

        .tab-content {
            display: none;
            padding: 30px;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .search-section {
            margin-bottom: 30px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 15px 20px;
            font-size: 16px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 15px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background: #5568d3;
        }

        button:active {
            transform: scale(0.98);
        }

        .result-container {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            min-height: 200px;
        }

        iframe {
            width: 100%;
            height: 600px;
            border: none;
            border-radius: 8px;
            background: white;
        }

        .history-list {
            list-style: none;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #f8f9fa;
            margin-bottom: 10px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .history-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }

        .word-link {
            flex: 1;
            cursor: pointer;
            color: #667eea;
            font-weight: 600;
            font-size: 16px;
        }

        .word-link:hover {
            text-decoration: underline;
        }

        .delete-btn {
            padding: 8px 16px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s ease;
        }

        .delete-btn:hover {
            background: #c82333;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }

        .empty-state h3 {
            margin-bottom: 10px;
            color: #495057;
        }

        .timestamp {
            font-size: 12px;
            color: #6c757d;
            margin-left: 15px;
        }

        .clear-all-btn {
            background: #6c757d;
            margin-bottom: 20px;
        }

        .clear-all-btn:hover {
            background: #5a6268;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="tabs">
            <button class="tab active" onclick="switchTab('search')">Search</button>
            <button class="tab" onclick="switchTab('history')">History</button>
        </div>

        <div id="search-tab" class="tab-content active">
            <div class="search-section">
                <h2 style="margin-bottom: 20px; color: #333;">Dictionary Lookup</h2>
                <div class="search-box">
                    <input 
                        type="text" 
                        id="wordInput" 
                        placeholder="Enter an English word..."
                        onkeypress="handleKeyPress(event)"
                    >
                    <select id="dictionarySelect" style="padding: 15px; font-size: 16px; border: 2px solid #e9ecef; border-radius: 8px; cursor: pointer;">
                        <option value="iciba">iCiba</option>
                        <option value="quword">Quword</option>
                        <option value="merriam">Merriam-Webster</option>
                    </select>
                    <button onclick="searchWord()">Search</button>
                </div>
            </div>
            <div class="result-container" id="resultContainer">
                <div class="empty-state">
                    <h3>Enter a word to get started</h3>
                    <p>Type an English word above and click search to see its definition</p>
                </div>
            </div>
        </div>

        <div id="history-tab" class="tab-content">
            <h2 style="margin-bottom: 20px; color: #333;">Search History</h2>
            <button class="clear-all-btn" onclick="clearAllHistory()">Clear All History</button>
            <ul class="history-list" id="historyList">
                <div class="empty-state">
                    <h3>No search history yet</h3>
                    <p>Words you search will appear here</p>
                </div>
            </ul>
        </div>
    </div>

    <script>
        // Load search history from localStorage
        function loadHistory() {
            const history = localStorage.getItem('searchHistory');
            return history ? JSON.parse(history) : [];
        }

        // Save search history to localStorage
        function saveHistory(history) {
            localStorage.setItem('searchHistory', JSON.stringify(history));
        }

        // Add word to history
        function addToHistory(word) {
            let history = loadHistory();
            
            // Remove duplicate if exists
            history = history.filter(item => item.word.toLowerCase() !== word.toLowerCase());
            
            // Add new word at the beginning
            history.unshift({
                word: word,
                timestamp: new Date().toISOString()
            });
            
            // Keep only last 50 searches
            if (history.length > 50) {
                history = history.slice(0, 50);
            }
            
            saveHistory(history);
            updateHistoryDisplay();
        }

        // Search word
        function searchWord() {
            const wordInput = document.getElementById('wordInput');
            const word = wordInput.value.trim();
            
            if (!word) {
                alert('Please enter a word');
                return;
            }
            
            // Add to history
            addToHistory(word);
            
            // Display result with selected dictionary
            const dictionary = document.getElementById('dictionarySelect').value;
            displayWord(word, dictionary);
        }

        // Display word definition
        function displayWord(word, dictionary = 'iciba') {
            const resultContainer = document.getElementById('resultContainer');
            let url;
            
            switch(dictionary) {
                case 'quword':
                    url = `https://www.quword.com/w/${encodeURIComponent(word)}`;
                    break;
                case 'merriam':
                    url = `https://www.merriam-webster.com/dictionary/${encodeURIComponent(word)}`;
                    break;
                case 'iciba':
                default:
                    url = `https://www.iciba.com/word?w=${encodeURIComponent(word)}`;
                    break;
            }
            
            resultContainer.innerHTML = `
                <iframe src="${url}" title="Dictionary Result"></iframe>
            `;
        }

        // Update history display
        function updateHistoryDisplay() {
            const historyList = document.getElementById('historyList');
            const history = loadHistory();
            
            if (history.length === 0) {
                historyList.innerHTML = `
                    <div class="empty-state">
                        <h3>No search history yet</h3>
                        <p>Words you search will appear here</p>
                    </div>
                `;
                return;
            }
            
            historyList.innerHTML = history.map((item, index) => {
                const date = new Date(item.timestamp);
                const timeStr = date.toLocaleString();
                
                return `
                    <li class="history-item">
                        <span class="word-link" onclick="searchFromHistory('${item.word}')">
                            ${item.word}
                        </span>
                        <span class="timestamp">${timeStr}</span>
                        <button class="delete-btn" onclick="deleteFromHistory(${index})">Delete</button>
                    </li>
                `;
            }).join('');
        }

        // Search from history
        function searchFromHistory(word) {
            // Switch to search tab
            switchTab('search');
            
            // Set input value
            document.getElementById('wordInput').value = word;
            
            // Get current dictionary selection
            const dictionary = document.getElementById('dictionarySelect').value;
            
            // Display result
            displayWord(word, dictionary);
        }

        // Delete from history
        function deleteFromHistory(index) {
            let history = loadHistory();
            history.splice(index, 1);
            saveHistory(history);
            updateHistoryDisplay();
        }

        // Clear all history
        function clearAllHistory() {
            if (confirm('Are you sure you want to clear all search history?')) {
                localStorage.removeItem('searchHistory');
                updateHistoryDisplay();
            }
        }

        // Switch tabs
        function switchTab(tabName) {
            // Update tab buttons
            const tabs = document.querySelectorAll('.tab');
            tabs.forEach(tab => {
                tab.classList.remove('active');
                if ((tabName === 'search' && tab.textContent === 'Search') ||
                    (tabName === 'history' && tab.textContent === 'History')) {
                    tab.classList.add('active');
                }
            });
            
            // Update tab content
            const tabContents = document.querySelectorAll('.tab-content');
            tabContents.forEach(content => content.classList.remove('active'));
            
            if (tabName === 'search') {
                document.getElementById('search-tab').classList.add('active');
            } else if (tabName === 'history') {
                document.getElementById('history-tab').classList.add('active');
                updateHistoryDisplay();
            }
        }

        // Handle Enter key press
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                searchWord();
            }
        }

        // Initialize history display on page load
        window.onload = function() {
            updateHistoryDisplay();
        };
    </script>
</body>
</html>
